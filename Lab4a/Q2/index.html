<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4a - Q2 Smart Number Validator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #24324a;
            max-width: 720px;
            margin: 60px auto;
            padding: 24px
        }

        main {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px #172b4d16
        }

        button {
            background: #2563eb;
            color: white;
            border: 0;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer
        }

        input {
            padding: 11px;
            border: 1px solid #aaa;
            border-radius: 7px
        }

        p,
        li {
            line-height: 1.7
        }
    </style>
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <h1>Lab 4a - Q2 Smart Number Validator</h1><label for="userInput">Enter a number:</label>
        <p><input type="text" id="userInput" placeholder="Enter a number"></p><button id="checkBtn"
            type="button">Check</button>
        <p id="result" role="status" aria-live="polite"></p>
    </main>
</body>

</html>
